[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard"
version = "0.1.0"
description = "Insurance Claim Flagging and Tagging System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ClaimGuard Contributors" }
]

[tool.setuptools.packages.find]
where = ["src"]
