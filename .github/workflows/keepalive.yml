name: Keepalive Ping

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Deployed App URL
        run: |
          if [ -n "$APP_URL" ]; then
            echo "Pinging $APP_URL..."
            curl -s -f -m 15 "$APP_URL" || echo "Ping returned status $?"
          else
            echo "APP_URL repository variable not set yet."
          fi
        env:
          APP_URL: ${{ vars.APP_URL }}
